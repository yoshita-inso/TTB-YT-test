<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>The Thinking Behind — YouTube Analytics Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Fragment+Mono&display=swap">
  
  <style>
    :root {
      --bg: #EEF1ED;
      --surface: #F8FAF7;
      --ink: #14201A;
      --muted: #55645B;
      --line: #D5DCD3;
      --accent: #1E6B50;
      --accent-soft: #D3E6DB;
      --good: #1E7A45;
      --bad: #B3361F;
      --prev: #8A9890;
      --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
      --font-body: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
      --font-data: "Fragment Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0E1512;
        --surface: #151F1A;
        --ink: #E6EDE8;
        --muted: #92A399;
        --line: #26342C;
        --accent: #5FC59A;
        --accent-soft: #1B3A2E;
        --good: #62C48A;
        --bad: #F0806A;
        --prev: #6C7C73;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.45;
      padding-inline: 16px;
      padding-block: 20px 40px;
    }

    .wrap { max-width: 1080px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
    button { font: inherit; color: inherit; }
    a { color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    .mast { position: relative; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; justify-content: space-between; padding-block: 8px 4px; overflow: hidden; }
    .contours { position: absolute; right: -40px; top: -60px; width: 340px; height: 220px; stroke: var(--line); fill: none; stroke-width: 1.2; pointer-events: none; }
    .mast > * { position: relative; }
    .eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
    h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 6vw, 46px); line-height: 1.02; letter-spacing: -.02em; margin: 0; }
    .sub { margin: 6px 0 0; color: var(--muted); }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 3px; gap: 2px; }
    .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: var(--font-data); font-size: 13px; color: var(--muted); }
    .seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--accent); color: var(--surface); }
    
    .btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    .stamp { font-family: var(--font-data); font-size: 12px; color: var(--muted); }

    .notice { border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--surface); padding: 12px 14px; border-radius: 8px; font-size: 14px; }
    .notice strong { display: block; margin-bottom: 2px; }
    .notice.warn { border-left-color: var(--bad); }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; border-left: 1px solid var(--line); border-top: 1px solid var(--line); margin: -1px 0 0 -1px; }
    .kpi .lbl { font-family: var(--font-data); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .kpi .val { font-size: clamp(30px, 5vw, 40px); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .kpi .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); min-height: 22px; }
    .delta { font-family: var(--font-data); font-size: 12px; padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
    .delta.up { color: var(--good); }
    .delta.down { color: var(--bad); }
    .delta.flat { color: var(--muted); }

    .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
    @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
    .card { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 16px 18px; min-width: 0; }
    .card-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    h2 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
    .legend { display: flex; gap: 14px; font-size: 12px; font-family: var(--font-data); color: var(--muted); margin-bottom: 4px; }
    .legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 6px; }
    .legend i.p { border-top: 2px dashed var(--prev); }

    .plot { position: relative; min-width: 0; }
    .plot svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
    .plot .g { stroke: var(--line); stroke-width: 1; }
    .plot .ax { fill: var(--muted); font-family: var(--font-data); font-size: 11px; }
    .plot .ln { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .plot .ar { fill: var(--accent-soft); opacity: .75; }
    .plot .pv { fill: none; stroke: var(--prev); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .plot .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
    .plot .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
    .tip { position: absolute; top: 4px; transform: translateX(-50%); background: var(--ink); color: var(--surface); font-size: 12px; padding: 6px 9px; border-radius: 6px; pointer-events: none; white-space: nowrap; font-family: var(--font-data); z-index: 2; }
    .tip b { font-weight: 400; display: block; opacity: .7; }

    .src { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .src li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
    .src .nm { overflow-wrap: anywhere; }
    .src .nv { font-family: var(--font-data); font-size: 13px; font-variant-numeric: tabular-nums; }
    .src .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px;
